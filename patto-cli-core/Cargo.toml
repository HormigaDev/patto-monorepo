[package]
name = "patto-cli-core"
version = "0.1.2"
edition = "2024"
license = "AGPL-3.0-only"

[[bin]]
name = "patto-core"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
thiserror = "2"
